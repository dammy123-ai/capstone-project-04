name: cd

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - 'monitoring/**'
      - 'scripts/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Provision infrastructure
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.tf-output.outputs.instance_id }}
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: terraform init
      - run: terraform apply -auto-approve -var-file=dev.tfvars
      - id: tf-output
        run: echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Kubernetes
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Send deploy command via SSM
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ needs.terraform-apply.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -eux",
              "mkdir -p /opt/zuri",
              "if [ -d /opt/zuri/app/.git ]; then cd /opt/zuri/app && git fetch origin && git checkout main && git reset --hard origin/main; else rm -rf /opt/zuri/app && git clone https://github.com/dammy123-ai/capstone-project-04.git /opt/zuri/app && cd /opt/zuri/app && git checkout main; fi",
              "cd /opt/zuri/app",
              "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
              "export AWS_DEFAULT_REGION=eu-west-1",
              "chmod +x scripts/deploy.sh scripts/sync-secrets.sh",
              "./scripts/deploy.sh dev"
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        run: |
          INSTANCE_ID="${{ needs.terraform-apply.outputs.instance_id }}"
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed with status: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy"
          exit 1